[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-balance-rating"
version = "0.1.0"
description = "OpenSkill (Plackett-Luce) tabanli, I/O'suz rating ve 5v5 takim dengeleme kutuphanesi"
requires-python = ">=3.11"
dependencies = [
    "openskill>=5.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[tool.setuptools.packages.find]
include = ["rating*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
