name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Backend bağımlılıkları
        # requirements.txt './rating' yolunu içerir — backend/ dizininden koşmalı
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Rating (dev) + collector bağımlılıkları
        run: |
          pip install "backend/rating[dev]"
          pip install -r collector/requirements.txt
      - name: Rating testleri
        working-directory: backend/rating
        run: pytest -q
      - name: Backend testleri
        working-directory: backend
        run: pytest tests -q
      - name: Collector testleri
        run: pytest collector -q
      - name: Webui i18n testleri
        # Sözlük bütünlüğü + hardcode taraması (docs/i18n_contract.md §5) — Node gerekmez.
        run: pytest webui/tests -q

  image:
    # main'e push'ta, testler geçince GHCR'a image basılır.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    # Yeni image GHCR'a çıkınca VPS'e SSH ile bağlanıp rollout restart tetikler.
    # 6443 dışarıya kapalıdır (VPS_HARDENING.md §1 Seçenek A); SSH anahtarı VPS'te
    # restrict+command= ile YALNIZCA /usr/local/bin/lol-balance-ci-deploy.sh'ı koşabilir.
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH kimliğini hazırla
        # Anahtar base64 tek satır olarak saklanır (SSH_DEPLOY_KEY_B64):
        # düz PEM yapıştırmada satır sonları kaybolup "error in libcrypto"
        # üretebiliyor; base64 bu hata sınıfını tamamen kapatır.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Anahtarı doğrula (içerik sızdırmadan)
        # ssh'a hiç gitmeden anahtarın kendisini test eder; hata mesajı yalnız
        # boyut/başlık-var-mı gibi sızdırmayan teşhis bilgisi basar.
        run: |
          SIZE=$(wc -c < ~/.ssh/id_ed25519)
          LINES=$(wc -l < ~/.ssh/id_ed25519)
          HAS_HEADER=$(head -1 ~/.ssh/id_ed25519 | grep -c 'BEGIN OPENSSH PRIVATE KEY' || true)
          echo "anahtar: ${SIZE} bayt, ${LINES} satır, OPENSSH başlığı: ${HAS_HEADER}"
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::SSH_DEPLOY_KEY_B64 decode edilen anahtar GEÇERSİZ (${SIZE} bayt, ${LINES} satır, başlık=${HAS_HEADER}). Secret'a base64'lenen kaynak dosya bozuk ya da yanlış dosya (.pub / eski kopya). VPS'te: 'ssh-keygen -y -f <anahtar>' ile doğrula, sonra 'base64 -w0 < <anahtar>' çıktısını TEK SATIR olarak secret'a koy."
            exit 1
          fi
          echo "anahtar geçerli (ssh-keygen -y başarılı)"
      - name: Rollout restart + bekle (VPS üzerinde)
        run: ssh -i ~/.ssh/id_ed25519 cideploy@lol.teomanagir.com deploy
