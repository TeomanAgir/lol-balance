name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Backend bağımlılıkları
        # requirements.txt './rating' yolunu içerir — backend/ dizininden koşmalı
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Rating (dev) + collector bağımlılıkları
        run: |
          pip install "backend/rating[dev]"
          pip install -r collector/requirements.txt
      - name: Rating testleri
        working-directory: backend/rating
        run: pytest -q
      - name: Backend testleri
        working-directory: backend
        run: pytest tests -q
      - name: Collector testleri
        run: pytest collector -q

  image:
    # main'e push'ta, testler geçince GHCR'a image basılır.
    # Deploy (cluster'ın yeni imajı çekmesi) VPS tarafında kurulacak — bkz. deploy/VPS_AGENT_BRIEF.md
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
