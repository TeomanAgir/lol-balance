<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<!-- Görünen tüm metin i18n sözlüklerinden gelir (docs/i18n_contract.md, GÖREV 6):
     statik düğümler data-i18n / data-i18n-placeholder / data-i18n-title /
     data-i18n-aria-label taşır ve i18n/core.js apply() ile doldurur; bu yüzden
     çoğu düğüm burada boştur. Marka adı "LoL Balance" çevrilmez ama <title>
     yine sözlükten geçer. -->
<title data-i18n="common.app_title">LoL Balance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1 class="brand">LoL <span>Balance</span></h1>
  <div class="topbar-actions">
    <!-- Dil düğmesi hedef dili gösterir: tr sözlüğünde "EN", en sözlüğünde "TR" —
         böylece apply() düğmeyi de kendiliğinden günceller. -->
    <button id="btn-lang" class="key-btn lang-btn" type="button"
            data-i18n="common.lang_btn" data-i18n-title="common.lang_btn_title"></button>
    <button id="btn-key" class="key-btn" type="button"
            data-i18n="common.key_btn" data-i18n-title="common.key_btn_title"></button>
  </div>
</header>

<main id="main">

  <!-- ═══ Dengeleme ═══ -->
  <section id="view-balance" class="view">
    <p class="view-hint" data-i18n="balance.hint"></p>

    <!-- Nemesis modu rozeti (GÖREV 3) — Enler ekranındaki "Nemesis maçı kur" açar,
         sağdaki × kapatır. Açıkken "Dengele" POST /balance/nemesis'e gider. -->
    <div id="nemesis-mode" class="nem-mode" hidden>
      <div class="nem-mode-body">
        <span class="nem-mode-title" data-i18n="balance.nem_mode_title"></span>
        <span id="nem-mode-pair" class="nem-mode-pair"></span>
        <span id="nem-mode-hint" class="nem-mode-hint"></span>
      </div>
      <button id="btn-nemesis-off" class="nem-mode-off" type="button"
              data-i18n-title="balance.nem_mode_off_title"
              data-i18n-aria-label="balance.nem_mode_off_title">×</button>
    </div>

    <div id="roster" class="roster-grid" aria-live="polite"></div>

    <div id="suggestions" class="suggestions"></div>

    <div class="action-bar">
      <!-- İçerik JS'te kurulur: updatePickCounter() → "{n}/10 seçildi" -->
      <div id="pick-counter" class="pick-counter"></div>
      <button id="btn-balance" class="btn-primary" type="button"
              data-i18n="balance.balance_btn" disabled></button>
    </div>
  </section>

  <!-- ═══ Leaderboard ═══ -->
  <section id="view-leaderboard" class="view" hidden>
    <p class="view-hint" data-i18n="leaderboard.hint"></p>
    <!-- Harita (GÖREV 4) girişi: alt çubuk 320px'de 6. sekmeyi kaldırmıyor -->
    <div class="map-entry"><button id="btn-map-from-board" class="map-link" type="button"
        data-i18n="leaderboard.map_link"></button></div>
    <table class="board">
      <thead><tr>
        <th class="rank" data-i18n="leaderboard.th_rank"></th>
        <th data-i18n="leaderboard.th_player"></th>
        <th class="num" data-i18n="leaderboard.th_score"></th>
        <th class="num" data-i18n="leaderboard.th_matches"></th>
      </tr></thead>
      <tbody id="board-body"></tbody>
    </table>
  </section>

  <!-- ═══ Haftanın enleri (GÖREV 2) ═══ -->
  <section id="view-highlights" class="view" hidden>
    <p class="view-hint" data-i18n="highlights.hint"></p>
    <!-- META (GÖREV 16) girişi: alt çubuk 320px'de 6. sekmeyi kaldırmıyor (ölçüm
         README'de) → harita/sağlık deseniyle "detay" görünümü olarak açılır.
         Giriş bilerek STATİK düğümdür: Enler gövdesi hata durumunda tamamen
         yeniden yazılıyor, giriş orada olsaydı /highlights düşünce kaybolurdu. -->
    <div class="mt-entry"><button id="btn-meta-open" class="mt-link" type="button"
        data-i18n="highlights.meta_link"></button></div>
    <div id="highlights-body" aria-live="polite"></div>
  </section>

  <!-- ═══ Harita: rol enleri (GÖREV 4) — sekme değil, Enler/Sıralama'dan açılan detay görünümü ═══ -->
  <!-- Harita ÖZGÜN, stilize bir illüstrasyondur: Riot varlığı/kopyası değildir,
       dış görsel dosyası yoktur (satır içi SVG). Baloncuklar JS ile yerleştirilir. -->
  <section id="view-map" class="view" hidden>
    <!-- Geri düğmesi metnini openMap() geldiği görünüme göre yazar -->
    <button id="btn-map-back" class="back-btn" type="button"></button>
    <p class="view-hint" data-i18n="map.hint"></p>

    <div class="rift">
      <svg class="rift-svg" viewBox="0 0 100 100" role="img"
           data-i18n-aria-label="map.svg_aria"
           focusable="false">
        <defs>
          <linearGradient id="rf-ground" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#0e1a27"/>
            <stop offset="0.5" stop-color="#12202f"/>
            <stop offset="1" stop-color="#0e1a27"/>
          </linearGradient>
          <linearGradient id="rf-river" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#123047"/>
            <stop offset="1" stop-color="#0e2639"/>
          </linearGradient>
          <clipPath id="rf-clip"><rect x="1" y="1" width="98" height="98" rx="9"/></clipPath>
        </defs>

        <rect class="rf-frame" x="1" y="1" width="98" height="98" rx="9" fill="url(#rf-ground)"/>

        <g clip-path="url(#rf-clip)">
        <!-- orman bölgeleri: koridorlar, nehir ve üsler arasında kalan dört alan -->
        <g class="rf-jungle">
          <path d="M19 24 L44 49 L19 75 Z"/>
          <path d="M26 80 L75 80 L50 55 Z"/>
          <path d="M25 20 L74 20 L49 44 Z"/>
          <path d="M81 26 L81 76 L55 50 Z"/>
        </g>
        <g class="rf-brush">
          <ellipse cx="26" cy="37" rx="4.6" ry="2.4"/>
          <ellipse cx="30" cy="57" rx="3.4" ry="2"/>
          <ellipse cx="43" cy="72" rx="4.6" ry="2.4"/>
          <ellipse cx="62" cy="73" rx="3.4" ry="2"/>
          <ellipse cx="37" cy="26" rx="3.4" ry="2"/>
          <ellipse cx="58" cy="27" rx="4.6" ry="2.4"/>
          <ellipse cx="70" cy="43" rx="3.4" ry="2"/>
          <ellipse cx="74" cy="62" rx="4.6" ry="2.4"/>
        </g>

        <!-- köşegen nehir + ortasındaki akıntı çizgisi -->
        <path class="rf-river" d="M24 17 L83 76 L76 83 L17 24 Z" fill="url(#rf-river)"/>
        <path class="rf-flow" d="M21.5 21.5 L79 79"/>
        <g class="rf-pit">
          <path d="M32 28.4 L35.6 32 L32 35.6 L28.4 32 Z"/>
          <path d="M68 64.4 L71.6 68 L68 71.6 L64.4 68 Z"/>
        </g>

        <!-- üç koridor (üst / orta / alt): geniş kenar + dar iç yol -->
        <g class="rf-lane">
          <path d="M18 74 L18 26 Q18 18 26 18 L74 18"/>
          <path d="M26 82 L74 82 Q82 82 82 74 L82 26"/>
          <path d="M25 75 L75 25"/>
        </g>
        <g class="rf-lane-in">
          <path d="M18 74 L18 26 Q18 18 26 18 L74 18"/>
          <path d="M26 82 L74 82 Q82 82 82 74 L82 26"/>
          <path d="M25 75 L75 25"/>
        </g>

        <!-- kuleler: koridor başına 3+3, taraf rengiyle -->
        <g class="rf-turret blue">
          <circle cx="18" cy="64"/><circle cx="18" cy="48"/><circle cx="18" cy="32"/>
          <circle cx="31" cy="69"/><circle cx="38" cy="62"/><circle cx="45" cy="55"/>
          <circle cx="32" cy="82"/><circle cx="48" cy="82"/><circle cx="64" cy="82"/>
        </g>
        <g class="rf-turret red">
          <circle cx="34" cy="18"/><circle cx="50" cy="18"/><circle cx="66" cy="18"/>
          <circle cx="55" cy="45"/><circle cx="62" cy="38"/><circle cx="69" cy="31"/>
          <circle cx="82" cy="64"/><circle cx="82" cy="48"/><circle cx="82" cy="32"/>
        </g>

        <!-- iki üs: sol-alt mavi, sağ-üst kırmızı -->
        <path class="rf-base blue" d="M3 77 A22 22 0 0 1 25 99 L3 99 Z"/>
        <path class="rf-base red"  d="M97 23 A22 22 0 0 1 75 1 L97 1 Z"/>
        <path class="rf-nexus blue" d="M13 84 L17 88 L13 92 L9 88 Z"/>
        <path class="rf-nexus red"  d="M87 8 L91 12 L87 16 L83 12 Z"/>
        </g>

        <rect class="rf-edge" x="1" y="1" width="98" height="98" rx="9"/>
      </svg>

      <div id="rift-bubbles" class="rift-bubbles" aria-live="polite"></div>
    </div>

    <p class="rift-note" data-i18n="map.note"></p>
  </section>

  <!-- ═══ META: şampiyon kademeleri (GÖREV 16) — sekme değil, Enler'den açılan detay görünümü ═══ -->
  <!-- Veri backend'den DEĞİL, statik dosyadan gelir: assets/meta/tiers.json
       (api_contract §8 "Meta tier verisi"). Süzgeç düğmeleri ve sütunlar app.js'te
       kurulur; dosya yoksa/bozuksa yalnız bu görünüm hata metni gösterir. -->
  <section id="view-meta" class="view" hidden>
    <!-- Geri düğmesi metnini loadMeta() yazar (geldiği görünüme göre) -->
    <button id="btn-meta-back" class="back-btn" type="button"></button>
    <!-- İçerik JS'te kurulur: renderMeta() → "Patch 16.16 · 15 Ağu" -->
    <div class="mt-head"><span id="meta-patch" class="mt-patch"></span></div>
    <p class="view-hint" data-i18n="meta.hint"></p>
    <div id="meta-filters" class="mt-filters" role="group"
         data-i18n-aria-label="meta.filter_aria" hidden></div>
    <div id="meta-body" aria-live="polite"></div>
  </section>

  <!-- ═══ Oyuncu profili (GÖREV 1) — sekme değil, sıralama/enler'den açılan detay görünümü ═══ -->
  <section id="view-profile" class="view" hidden>
    <!-- Geri düğmesi metnini openProfile() geldiği görünüme göre yazar -->
    <button id="btn-profile-back" class="back-btn" type="button"></button>
    <div id="profile-body" aria-live="polite"></div>
  </section>

  <!-- ═══ Maç geçmişi ═══ -->
  <section id="view-matches" class="view" hidden>
    <p class="view-hint" data-i18n="matches.hint"></p>
    <div id="match-list" class="match-list"></div>
  </section>

  <!-- ═══ Maç detayı (GÖREV 8) — sekme değil, Geçmiş'teki maç kartından açılan detay görünümü ═══ -->
  <!-- Veri yeni bir uçtan değil, GET /matches yanıtındaki participants.stats'tan gelir;
       görünüm tamamen app.js'te kurulur (matchDetailHtml). -->
  <section id="view-matchdetail" class="view" hidden>
    <!-- Geri düğmesi metnini loadMatchDetail() yazar (her zaman "Geçmiş"e döner) -->
    <button id="btn-matchdetail-back" class="back-btn" type="button"></button>
    <div id="matchdetail-body" aria-live="polite"></div>
  </section>

  <!-- ═══ Manuel giriş ═══ -->
  <section id="view-manual" class="view" hidden>
    <p class="view-hint" data-i18n="manual.hint"></p>
    <!-- Collector sağlığı (GÖREV 13) girişi: yeni sekme değil, Manuel'den açılan
         detay görünümü (harita/profil deseni; alt çubukta Manuel yanık kalır). -->
    <div class="ch-entry"><button id="btn-health-open" class="ch-link" type="button"
        data-i18n="manual.health_link"></button></div>
    <div id="manual-roster" class="manual-list"></div>

    <fieldset class="winner-pick">
      <legend data-i18n="manual.winner_legend"></legend>
      <!-- Metin ayrı span'dedir: data-i18n textContent yazar, radyo input'u korunur -->
      <label class="winner-opt blue"><input type="radio" name="winner" value="100"><span data-i18n="manual.winner_blue"></span></label>
      <label class="winner-opt red"><input type="radio" name="winner" value="200"><span data-i18n="manual.winner_red"></span></label>
    </fieldset>

    <div class="action-bar">
      <!-- İçerik JS'te kurulur: updateManualCounter() → "Mavi {b}/5 · Kırmızı {r}/5" -->
      <div id="manual-counter" class="pick-counter small"></div>
      <button id="btn-manual-submit" class="btn-primary" type="button"
              data-i18n="manual.submit_btn" disabled></button>
    </div>
  </section>

  <!-- ═══ Collector sağlığı (GÖREV 13) — sekme değil, Manuel'den açılan detay görünümü ═══ -->
  <!-- Veri: GET /health/collectors (api_contract §6). Otomatik polling YOK:
       görünüm açılınca bir kez çekilir, "Yenile" düğmesi elle tazeler. -->
  <section id="view-health" class="view" hidden>
    <!-- Geri düğmesi metnini loadHealth() yazar (her zaman Manuel'e döner) -->
    <button id="btn-health-back" class="back-btn" type="button"></button>
    <p class="view-hint" data-i18n="health.hint"></p>
    <div class="ch-bar">
      <!-- İçerik JS'te kurulur: loadHealth() → "3 cihaz" -->
      <span id="health-count" class="ch-count"></span>
      <button id="btn-health-refresh" class="ch-refresh" type="button"
              data-i18n="health.refresh"></button>
    </div>
    <div id="health-body" aria-live="polite"></div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab active" data-view="balance"     type="button" data-i18n="common.tab_balance"></button>
  <button class="tab"        data-view="leaderboard" type="button" data-i18n="common.tab_leaderboard"></button>
  <button class="tab"        data-view="highlights"  type="button" data-i18n="common.tab_highlights"></button>
  <button class="tab"        data-view="matches"     type="button" data-i18n="common.tab_matches"></button>
  <button class="tab"        data-view="manual"      type="button" data-i18n="common.tab_manual"></button>
</nav>

<!-- API key modal -->
<div id="key-modal" class="modal-backdrop" hidden>
  <form id="key-form" class="modal">
    <h2 data-i18n="keymodal.title"></h2>
    <!-- Cümle <code>.env</code> etrafında iki span'e bölündü: data-i18n textContent
         yazdığı için işaretlemeyi içeremez; iki dilde de bu bölünme dilbilgisel çalışır. -->
    <p><span data-i18n="keymodal.desc1"></span> <code>.env</code> <span data-i18n="keymodal.desc2"></span></p>
    <input id="key-input" type="password" autocomplete="off"
           data-i18n-placeholder="keymodal.placeholder" required>
    <button class="btn-primary" type="submit" data-i18n="keymodal.save_btn"></button>
  </form>
</div>

<!-- Rol sıralaması pop-up'ı (GÖREV 4) — API anahtarı modalıyla aynı backdrop deseni -->
<div id="role-modal" class="modal-backdrop" hidden>
  <div class="modal modal-list" role="dialog" aria-modal="true" aria-labelledby="role-modal-title">
    <button id="role-modal-close" class="modal-x" type="button"
            data-i18n-aria-label="common.close">×</button>
    <h2 id="role-modal-title"></h2>
    <div id="role-modal-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>window.APP_CONFIG = { USE_MOCK: false, API_BASE: "/api/v1" }; // USE_MOCK: true -> mock_api.js (lokal gelistirme)</script>
<script src="mock_api.js"></script>
<!-- i18n yükleme sırası contract geregi: tr.js, en.js, core.js, sonra app.js -->
<script src="i18n/tr.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/core.js"></script>
<script src="app.js"></script>
</body>
</html>
