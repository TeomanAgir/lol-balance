<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<!-- Görünen tüm metin i18n sözlüklerinden gelir (docs/i18n_contract.md, GÖREV 6):
     statik düğümler data-i18n / data-i18n-placeholder / data-i18n-title /
     data-i18n-aria-label taşır ve i18n/core.js apply() ile doldurur; bu yüzden
     çoğu düğüm burada boştur. Marka adı "LoL Balance" çevrilmez ama <title>
     yine sözlükten geçer. -->
<title data-i18n="common.app_title">LoL Balance</title>
<!-- Yazı tipleri (GÖREV 24-fix2, Teoman kararı: "harici font yok" kuralı BU İŞ
     İÇİN gevşetildi): K2-2 konseptinin aileleri gerçekten yüklenir. preconnect
     el sıkışmayı öne alır, display=swap ilk boyamayı bloklamaz. Ağ/CDN
     erişilemezse hiçbir şey bozulmaz: her değişkende GERÇEK yerel yığın vardır
     (--display → Bahnschrift/Arial Narrow, --body → system-ui/Segoe UI,
     --mono → ui-monospace/Cascadia/Consolas), yani site fontsuz kalmaz. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ Uygulama kabuğu (GÖREV 17, K1 "Sade Ray"): kalıcı sol gezinme ═══
     Masaüstünde (≥880px) panel hep açık sabit sütundur; mobilde soldan kayan
     çekmece (üst bardaki hamburger açar, scrim/Esc kapatır — app.js "Sol
     gezinme kabuğu" bloğu). Sekme seti ve data-view mekanizması alt çubuk
     dönemindekiyle birebir aynıdır; liste GRUPLANDI (GÖREV 22): .sb-group
     başlığı + ardından .sb-item'lar, gruplar arası .sb-gap ayracı. SSS/Sağlık
     listenin sonunda grupsuz (yalnız üstlerinde ayraç var, başlık yok). -->
<div id="sb-app" class="sb-app">

<aside id="sb-nav" class="sb-nav" data-i18n-aria-label="common.nav_aria">
  <div class="sb-brand">LoL <span>Balance</span></div>
  <nav class="sb-list">
    <div class="sb-group" data-i18n="common.nav_group_room"></div>
    <button class="sb-item active" data-view="balance"     type="button" data-i18n="common.tab_balance"></button>
    <button class="sb-item"        data-view="leaderboard" type="button" data-i18n="common.tab_leaderboard"></button>
    <button class="sb-item"        data-view="highlights"  type="button" data-i18n="common.tab_highlights"></button>
    <button class="sb-item"        data-view="matches"     type="button" data-i18n="common.tab_matches"></button>

    <div class="sb-gap" aria-hidden="true"></div>
    <div class="sb-group" data-i18n="common.nav_group_champselect"></div>
    <button class="sb-item"        data-view="meta"        type="button" data-i18n="common.tab_meta"></button>
    <button class="sb-item"        data-view="matchup"     type="button" data-i18n="common.tab_matchup"></button>
    <button class="sb-item"        data-view="pick"        type="button" data-i18n="common.tab_pick"></button>

    <div class="sb-gap" aria-hidden="true"></div>
    <button class="sb-item"        data-view="faq"         type="button" data-i18n="common.tab_faq"></button>
    <button class="sb-item"        data-view="health"      type="button" data-i18n="common.tab_health"></button>
    <!-- Kontrol Paneli (fix-2): satır herkese görünür, İÇERİK şifre ister. -->
    <button class="sb-item"        data-view="control"     type="button" data-i18n="common.tab_control"></button>
  </nav>
  <div class="sb-bottom">
    <!-- Dil düğmesi hedef dili gösterir: tr sözlüğünde "EN", en sözlüğünde "TR" —
         böylece apply() düğmeyi de kendiliğinden günceller. -->
    <button id="btn-lang" class="sb-kb sb-lang" type="button"
            data-i18n="common.lang_btn" data-i18n-title="common.lang_btn_title"></button>
    <button id="btn-key" class="sb-kb" type="button"
            data-i18n="common.key_btn" data-i18n-title="common.key_btn_title"></button>
  </div>
</aside>

<!-- Mobil çekmece karartması: tıklayınca çekmece kapanır (app.js) -->
<div id="sb-scrim" class="sb-scrim" aria-hidden="true"></div>

<div class="sb-content">

<!-- Mobil üst bar: yalnız <880px görünür; masaüstünde marka panelde -->
<header class="sb-topbar">
  <button id="sb-burger" class="sb-burger" type="button" aria-expanded="false"
          aria-controls="sb-nav" data-i18n-aria-label="common.menu_btn">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <h1 class="sb-tb-brand">LoL <span>Balance</span></h1>
</header>

<main id="main">

  <!-- ═══ Dengeleme ═══ -->
  <section id="view-balance" class="view">
    <p class="view-hint" data-i18n="balance.hint"></p>

    <!-- Nemesis modu rozeti (GÖREV 3) — Enler ekranındaki "Nemesis maçı kur" açar,
         sağdaki × kapatır. Açıkken "Dengele" POST /balance/nemesis'e gider. -->
    <div id="nemesis-mode" class="nem-mode" hidden>
      <div class="nem-mode-body">
        <span class="nem-mode-title" data-i18n="balance.nem_mode_title"></span>
        <span id="nem-mode-pair" class="nem-mode-pair"></span>
        <span id="nem-mode-hint" class="nem-mode-hint"></span>
      </div>
      <button id="btn-nemesis-off" class="nem-mode-off" type="button"
              data-i18n-title="balance.nem_mode_off_title"
              data-i18n-aria-label="balance.nem_mode_off_title">×</button>
    </div>

    <div id="roster" class="roster-grid" aria-live="polite"></div>

    <div id="suggestions" class="suggestions"></div>

    <!-- RULET sonuç kartları (GÖREV 23): içerik app.js renderRoulette() ile kurulur.
         Sayfa açılışında GET /roulette/current doluysa aktif oturum da burada görünür. -->
    <div id="roulette-box" class="rlt-box" aria-live="polite"></div>

    <div class="action-bar">
      <!-- İçerik JS'te kurulur: updatePickCounter() → "{n}/10 seçildi" -->
      <div id="pick-counter" class="pick-counter"></div>
      <!-- RULET! (GÖREV 23) DENGELE ile aynı seçim kuralına bağlıdır: tam 10 seçili -->
      <div class="ab-btns">
        <button id="btn-roulette" class="btn-roulette" type="button"
                data-i18n="roulette.btn" data-i18n-title="roulette.btn_title" disabled></button>
        <button id="btn-balance" class="btn-primary" type="button"
                data-i18n="balance.balance_btn" disabled></button>
      </div>
    </div>
  </section>

  <!-- ═══ Seçim danışmanı (GÖREV 21, tasarım S3 "Analiz Paneli") ═══ -->
  <!-- Veri: assets/meta/tiers.json + counters.json + Data Dragon champions.json
       (tags/info) — hepsi statik dosyadır, backend bu veriyi bilmez (api_contract
       §8). Analiz tamamen istemcidedir: advisor.js motoru, app.js "Seçim" bloğu
       çizer. Grup rozeti GET /matches'tan türetilir, öneri SIRASINI etkilemez.
       Bu görünüm görünüm-bazlı GENİŞLİK İSTİSNASI taşır: showView main'e
       .pa-wide basar (1080px), diğer görünümler 720px'te kalır. İçerik tamamen
       JS'te kurulur (loadPick → sol giriş listeleri + sağ analiz paneli). -->
  <section id="view-pick" class="view" hidden>
    <p class="view-hint" data-i18n="pick.hint"></p>
    <div id="pick-body" class="pa-grid"></div>
  </section>

  <!-- ═══ Eşleşme optimizasyonu (GÖREV 21-FIX; tasarım M1 "Sahne") ═══ -->
  <!-- S3 "Seçim" ekranından AYRI, yeni bir sayfa: Teoman geri bildirimi üzerine
       çok adımlı S3 rafa kaldırıldı (kodu/davranışı DEĞİŞMEDİ), burada tek rol
       seçimi + tek rakip şampiyon ile hafif bir akış kurulur. Veri: yine
       assets/meta/tiers.json + counters.json (api_contract §8) — app.js'in
       Seçim ekranıyla PAYLAŞTIĞI fetchMeta()/fetchCounters() önbellekli
       yükleyicileri ve advisor.js'in tierIndex()/counterRecords() saf
       yardımcıları burada da kullanılır (veri mantığı KOPYALANMAZ). Sezgisel
       early/late ve grup W/R rozetleri BU EKRANDA YOK (Teoman geri bildirimi).
       İçerik tamamen JS'te kurulur (loadMatchup → renderMatchupShell). -->
  <section id="view-matchup" class="view" hidden>
    <div id="mo-app" class="mo-app">
      <div class="mo-stage">
        <div class="mo-kicker" data-i18n="matchup.kicker"></div>
        <h1 class="mo-h1" data-i18n="matchup.title"></h1>
        <p class="mo-sub" data-i18n="matchup.subtitle"></p>
        <div id="mo-roles" class="mo-roles" role="group"
             data-i18n-aria-label="matchup.role_group_aria"></div>
      </div>
      <div id="mo-stepwrap" class="mo-stepwrap">
        <div class="mo-panel">
          <section class="mo-card">
            <h2 class="mo-card-title" data-i18n="matchup.enemy_card_title"></h2>
            <!-- Arama kutusu app.js'te kurulur (pick ekranındaki pa-input
                 desenine uyarlanmıştır): her açılışta TAZE düğümlerle kurulur,
                 dinleyici birikmesi olmaz. -->
            <div id="mo-search-wrap"></div>
            <p id="mo-enemy-state" class="mo-state"></p>
          </section>
          <section class="mo-card">
            <h2 id="mo-result-title" class="mo-card-title"></h2>
            <div id="mo-list" class="mo-list" aria-live="polite"></div>
          </section>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ Leaderboard ═══ -->
  <section id="view-leaderboard" class="view" hidden>
    <p class="view-hint" data-i18n="leaderboard.hint"></p>
    <!-- Harita (GÖREV 4) girişi: harita sekme DEĞİL, buradan açılan detay görünümü -->
    <div class="map-entry"><button id="btn-map-from-board" class="map-link" type="button"
        data-i18n="leaderboard.map_link"></button></div>
    <table class="board">
      <thead><tr>
        <th class="rank" data-i18n="leaderboard.th_rank"></th>
        <th data-i18n="leaderboard.th_player"></th>
        <th class="num" data-i18n="leaderboard.th_score"></th>
        <th class="num" data-i18n="leaderboard.th_matches"></th>
      </tr></thead>
      <tbody id="board-body"></tbody>
    </table>
  </section>

  <!-- ═══ Haftanın enleri (GÖREV 2) ═══ -->
  <section id="view-highlights" class="view" hidden>
    <p class="view-hint" data-i18n="highlights.hint"></p>
    <div id="highlights-body" aria-live="polite"></div>
  </section>

  <!-- ═══ Harita: rol enleri (GÖREV 4) — sekme değil, Enler/Sıralama'dan açılan detay görünümü ═══ -->
  <!-- Harita ÖZGÜN, stilize bir illüstrasyondur: Riot varlığı/kopyası değildir,
       dış görsel dosyası yoktur (satır içi SVG). Baloncuklar JS ile yerleştirilir. -->
  <section id="view-map" class="view" hidden>
    <!-- Geri düğmesi metnini openMap() geldiği görünüme göre yazar -->
    <button id="btn-map-back" class="back-btn" type="button"></button>
    <p class="view-hint" data-i18n="map.hint"></p>

    <div class="rift">
      <svg class="rift-svg" viewBox="0 0 100 100" role="img"
           data-i18n-aria-label="map.svg_aria"
           focusable="false">
        <defs>
          <linearGradient id="rf-ground" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#0e1a27"/>
            <stop offset="0.5" stop-color="#12202f"/>
            <stop offset="1" stop-color="#0e1a27"/>
          </linearGradient>
          <linearGradient id="rf-river" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#123047"/>
            <stop offset="1" stop-color="#0e2639"/>
          </linearGradient>
          <clipPath id="rf-clip"><rect x="1" y="1" width="98" height="98" rx="9"/></clipPath>
        </defs>

        <rect class="rf-frame" x="1" y="1" width="98" height="98" rx="9" fill="url(#rf-ground)"/>

        <g clip-path="url(#rf-clip)">
        <!-- orman bölgeleri: koridorlar, nehir ve üsler arasında kalan dört alan -->
        <g class="rf-jungle">
          <path d="M19 24 L44 49 L19 75 Z"/>
          <path d="M26 80 L75 80 L50 55 Z"/>
          <path d="M25 20 L74 20 L49 44 Z"/>
          <path d="M81 26 L81 76 L55 50 Z"/>
        </g>
        <g class="rf-brush">
          <ellipse cx="26" cy="37" rx="4.6" ry="2.4"/>
          <ellipse cx="30" cy="57" rx="3.4" ry="2"/>
          <ellipse cx="43" cy="72" rx="4.6" ry="2.4"/>
          <ellipse cx="62" cy="73" rx="3.4" ry="2"/>
          <ellipse cx="37" cy="26" rx="3.4" ry="2"/>
          <ellipse cx="58" cy="27" rx="4.6" ry="2.4"/>
          <ellipse cx="70" cy="43" rx="3.4" ry="2"/>
          <ellipse cx="74" cy="62" rx="4.6" ry="2.4"/>
        </g>

        <!-- köşegen nehir + ortasındaki akıntı çizgisi -->
        <path class="rf-river" d="M24 17 L83 76 L76 83 L17 24 Z" fill="url(#rf-river)"/>
        <path class="rf-flow" d="M21.5 21.5 L79 79"/>
        <g class="rf-pit">
          <path d="M32 28.4 L35.6 32 L32 35.6 L28.4 32 Z"/>
          <path d="M68 64.4 L71.6 68 L68 71.6 L64.4 68 Z"/>
        </g>

        <!-- üç koridor (üst / orta / alt): geniş kenar + dar iç yol -->
        <g class="rf-lane">
          <path d="M18 74 L18 26 Q18 18 26 18 L74 18"/>
          <path d="M26 82 L74 82 Q82 82 82 74 L82 26"/>
          <path d="M25 75 L75 25"/>
        </g>
        <g class="rf-lane-in">
          <path d="M18 74 L18 26 Q18 18 26 18 L74 18"/>
          <path d="M26 82 L74 82 Q82 82 82 74 L82 26"/>
          <path d="M25 75 L75 25"/>
        </g>

        <!-- kuleler: koridor başına 3+3, taraf rengiyle -->
        <g class="rf-turret blue">
          <circle cx="18" cy="64"/><circle cx="18" cy="48"/><circle cx="18" cy="32"/>
          <circle cx="31" cy="69"/><circle cx="38" cy="62"/><circle cx="45" cy="55"/>
          <circle cx="32" cy="82"/><circle cx="48" cy="82"/><circle cx="64" cy="82"/>
        </g>
        <g class="rf-turret red">
          <circle cx="34" cy="18"/><circle cx="50" cy="18"/><circle cx="66" cy="18"/>
          <circle cx="55" cy="45"/><circle cx="62" cy="38"/><circle cx="69" cy="31"/>
          <circle cx="82" cy="64"/><circle cx="82" cy="48"/><circle cx="82" cy="32"/>
        </g>

        <!-- iki üs: sol-alt mavi, sağ-üst kırmızı -->
        <path class="rf-base blue" d="M3 77 A22 22 0 0 1 25 99 L3 99 Z"/>
        <path class="rf-base red"  d="M97 23 A22 22 0 0 1 75 1 L97 1 Z"/>
        <path class="rf-nexus blue" d="M13 84 L17 88 L13 92 L9 88 Z"/>
        <path class="rf-nexus red"  d="M87 8 L91 12 L87 16 L83 12 Z"/>
        </g>

        <rect class="rf-edge" x="1" y="1" width="98" height="98" rx="9"/>
      </svg>

      <div id="rift-bubbles" class="rift-bubbles" aria-live="polite"></div>
    </div>

    <p class="rift-note" data-i18n="map.note"></p>
  </section>

  <!-- ═══ META: şampiyon kademeleri (GÖREV 16) — kendi gezinme sekmesi (GÖREV 17) ═══ -->
  <!-- Veri backend'den DEĞİL, statik dosyadan gelir: assets/meta/tiers.json
       (api_contract §8 "Meta tier verisi"). Süzgeç düğmeleri ve sütunlar app.js'te
       kurulur; dosya yoksa/bozuksa yalnız bu görünüm hata metni gösterir.
       Normal sekme olduğu için geri düğmesi YOKTUR (Teoman kararı: üzerine başka
       modüller bineceği için Enler'in altındaki detay girişi kaldırıldı). -->
  <section id="view-meta" class="view" hidden>
    <!-- İçerik JS'te kurulur: renderMeta() → "Patch 16.16 · 15 Ağu" -->
    <div class="mt-head"><span id="meta-patch" class="mt-patch"></span></div>
    <p class="view-hint" data-i18n="meta.hint"></p>
    <div id="meta-filters" class="mt-filters" role="group"
         data-i18n-aria-label="meta.filter_aria" hidden></div>
    <div id="meta-body" aria-live="polite"></div>
  </section>

  <!-- ═══ SSS (FAQ) — kendi gezinme sekmesi (Teoman talebi, 2026-08-16) ═══ -->
  <!-- Veri backend'den DEĞİL statik dosyalardan gelir (META deseni):
       assets/faq/index.json manifest'i kartları, assets/faq/{tr,en}/*.md
       dosyaları madde içeriğini taşır. Madde detayının kalıcı adresi vardır:
       #faq/<slug> (deep-link app.js "SSS" bloğunda çözülür). İçerik markdown'dan
       app.js'teki mdToHtml ile render edilir: önce HTML kaçışı, sonra dönüşüm. -->
  <section id="view-faq" class="view" hidden>
    <p class="view-hint" data-i18n="faq.hint"></p>
    <div id="faq-list" class="fq-list" aria-live="polite"></div>
  </section>

  <!-- ═══ SSS madde detayı — sekme değil, SSS listesinden açılan detay görünümü ═══ -->
  <section id="view-faqdetail" class="view" hidden>
    <!-- Geri düğmesi metnini loadFaqDetail() yazar (her zaman SSS listesine döner) -->
    <button id="btn-faqdetail-back" class="back-btn" type="button"></button>
    <div id="faqdetail-body" aria-live="polite"></div>
  </section>

  <!-- ═══ Oyuncu profili (GÖREV 1) — sekme değil, sıralama/enler'den açılan detay görünümü ═══ -->
  <section id="view-profile" class="view" hidden>
    <!-- Geri düğmesi metnini openProfile() geldiği görünüme göre yazar -->
    <button id="btn-profile-back" class="back-btn" type="button"></button>
    <div id="profile-body" aria-live="polite"></div>
  </section>

  <!-- ═══ Maç geçmişi ═══ -->
  <section id="view-matches" class="view" hidden>
    <p class="view-hint" data-i18n="matches.hint"></p>
    <div id="match-list" class="match-list"></div>
  </section>

  <!-- ═══ Maç detayı (GÖREV 8) — sekme değil, Geçmiş'teki maç kartından açılan detay görünümü ═══ -->
  <!-- Veri yeni bir uçtan değil, GET /matches yanıtındaki participants.stats'tan gelir;
       görünüm tamamen app.js'te kurulur (matchDetailHtml). -->
  <section id="view-matchdetail" class="view" hidden>
    <!-- Geri düğmesi metnini loadMatchDetail() yazar (her zaman "Geçmiş"e döner) -->
    <button id="btn-matchdetail-back" class="back-btn" type="button"></button>
    <div id="matchdetail-body" aria-live="polite"></div>
  </section>

  <!-- ═══ Collector sağlığı (GÖREV 13; GÖREV 20 ile kendi sekmesine taşındı) ═══ -->
  <!-- Veri: GET /health/collectors (api_contract §6). Otomatik polling YOK:
       görünüm açılınca bir kez çekilir, "Yenile" düğmesi elle tazeler. Normal
       sekme gibi çözülür (META deseni, GÖREV 17), geri düğmesi yoktur. -->
  <section id="view-health" class="view" hidden>
    <p class="view-hint" data-i18n="health.hint"></p>
    <div class="ch-bar">
      <!-- İçerik JS'te kurulur: loadHealth() → "3 cihaz" -->
      <span id="health-count" class="ch-count"></span>
      <button id="btn-health-refresh" class="ch-refresh" type="button"
              data-i18n="health.refresh"></button>
    </div>
    <div id="health-body" aria-live="polite"></div>
  </section>

  <!-- ═══ Kontrol Paneli (fix-2; iç düzen fix-3) — şifre korumalı idari yüzey ═══ -->
  <!-- Sayfa girişte şifre sorar; şifre YALNIZ bellekte tutulur (localStorage'a
       YAZILMAZ) ve her sayfa yenilemesinde yeniden istenir. Doğrulama yan
       etkisiz GET /admin/ping (204) iledir; idari çağrılar X-API-Key'e EK
       olarak X-Admin-Key taşır (api_contract "Admin anahtarı"). İçerik tamamen
       app.js'te kurulur (loadControl → renderControlGate | renderControlPanel):
       sekmeli panel — Maçlar (tüm maçlar + arama/süzgeç, Void/Geri Al, rol
       düzeltme, rulet bağını çözme) · Oyuncular (ad düzeltme) · Bakım (replay).
       fix-3: aria-live BURADAN KALDIRILDI — 200 satırlık liste her çizimde
       baştan okunuyordu; canlı bildirim artık sonuç sayacındadır (role=status)
       ve sonuç metinleri toast'ta duyurulur. -->
  <section id="view-control" class="view" hidden>
    <p class="view-hint" data-i18n="control.hint"></p>
    <div id="control-body"></div>
  </section>

</main>

</div><!-- /.sb-content -->
</div><!-- /#sb-app -->

<!-- API key modal -->
<div id="key-modal" class="modal-backdrop" hidden>
  <form id="key-form" class="modal">
    <h2 data-i18n="keymodal.title"></h2>
    <!-- Cümle <code>.env</code> etrafında iki span'e bölündü: data-i18n textContent
         yazdığı için işaretlemeyi içeremez; iki dilde de bu bölünme dilbilgisel çalışır. -->
    <p><span data-i18n="keymodal.desc1"></span> <code>.env</code> <span data-i18n="keymodal.desc2"></span></p>
    <input id="key-input" type="password" autocomplete="off"
           data-i18n-placeholder="keymodal.placeholder" required>
    <button class="btn-primary" type="submit" data-i18n="keymodal.save_btn"></button>
  </form>
</div>

</div>
