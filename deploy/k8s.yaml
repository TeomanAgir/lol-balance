# lol-balance — Kubernetes manifests (VPS cluster'a uyarlanmış)
# Uygulayan: VPS agent, 2026-08-11. Kaynak brief: deploy/VPS_AGENT_BRIEF.md
# NOT: Secret'lar bu dosyada DEĞİL — imperatif oluşturulur:
#   kubectl -n lol-balance create secret generic lol-balance-secrets \
#     --from-literal=API_KEY=<değer> --from-literal=ADMIN_KEY=<değer>
#   kubectl -n lol-balance create secret docker-registry ghcr-pull ... (apps ns'inden kopyalandı)
# ADMIN_KEY (fix-2) idari uçların ikinci anahtarıdır; yoksa o uçlar 503 verir.
# Ek grup (GÖREV 35, api_contract "Çoklu grup"): aynı secret'a iki anahtar eklenir,
# envFrom hepsini yükler — manifest değişmez, yeniden başlatma yeter:
#   kubectl -n lol-balance patch secret lol-balance-secrets \
#     -p '{"stringData":{"GROUP_<AD>_API_KEY":"<değer>","GROUP_<AD>_ADMIN_KEY":"<değer>"}}'
#   kubectl -n lol-balance rollout restart deployment/lol-balance
apiVersion: v1
kind: Namespace
metadata:
  name: lol-balance
  labels:
    # GÖREV 38: host ağı/hostPath/ayrıcalıklı konteyner isteyen pod'lar reddedilir.
    pod-security.kubernetes.io/enforce: baseline
---
# GÖREV 38: namespace giriş yalıtımı. Pod'lara yalnız aynı namespace ve izleme
# (monitoring) bağlanabilir; ingress-nginx ve kubelet host üzerinden geldiği için
# Cilium'da her zaman izinlidir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ns-isolation
  namespace: lol-balance
  labels:
    hardening: g38-ns-isolation
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lol-balance-data
  namespace: lol-balance
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lol-balance
  namespace: lol-balance
spec:
  replicas: 1                    # SQLite tek yazar — asla artırma
  strategy:
    type: Recreate               # eski pod ölmeden yenisi DB'ye dokunmasın
  selector:
    matchLabels:
      app: lol-balance
  template:
    metadata:
      labels:
        app: lol-balance
    spec:
      containers:
        - name: app
          image: ghcr.io/teomanagir/lol-balance:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: lol-balance-secrets
          # DB_PATH ve WEBUI_DIR image içinde tanımlı (/data/lol_balance.db, /app/webui)
          # ENGINE_VERSION verilmez: image default'u aktif version'dır
          env:
            # İdari uçların ikinci anahtarı (api_contract "Admin anahtarı", fix-2):
            # void / unvoid / admin replay / admin ping bunu ister. Değer YALNIZ
            # secret'ta yaşar — repo public, hiçbir dosyaya yazılmaz:
            #   kubectl -n lol-balance patch secret lol-balance-secrets \
            #     -p '{"stringData":{"ADMIN_KEY":"<değer>"}}'
            # optional: true — secret'ta anahtar henüz yokken deploy KIRILMAZ;
            # o durumda backend idari uçlara 503 döner (yüzey kapalı kalır).
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: lol-balance-secrets
                  key: ADMIN_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lol-balance-data
---
apiVersion: v1
kind: Service
metadata:
  name: lol-balance
  namespace: lol-balance
spec:
  selector:
    app: lol-balance
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lol-balance
  namespace: lol-balance
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"   # API key düz metin — HTTPS zorunlu
    # İstek seli sınırı (GÖREV 38): IP başına sürekli 30 istek/sn, 300'e kadar ani yük
    # (ölçülen meşru tepe: tek IP'den 109 istek/sn — görsel ağırlıklı sayfa açılışı),
    # IP başına en çok 150 eşzamanlı bağlantı. Küme içi ve sunucunun kendi IP'si muaf.
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "10"
    nginx.ingress.kubernetes.io/limit-connections: "150"
    nginx.ingress.kubernetes.io/limit-whitelist: "10.244.0.0/16,159.195.216.232/32,127.0.0.1/32"
spec:
  ingressClassName: nginx
  rules:
    - host: lol.teomanagir.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lol-balance
                port:
                  number: 80
  tls:
    - hosts:
        - lol.teomanagir.com
      secretName: lol-balance-tls
---
# Günlük SQLite yedeği — aynı PVC'ye /data/backup altına .backup; 7 günden eskiler silinir.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lol-balance-backup
  namespace: lol-balance
spec:
  schedule: "30 3 * * *"         # her gün 03:30 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: alpine:3.20
              # GÖREV 38: yedek işi sınırsız kaynak tüketemesin (DB'ler MB mertebesinde).
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk add --no-cache sqlite >/dev/null
                  mkdir -p /data/backup
                  # Çoklu grup (GÖREV 35): /data altındaki HER grup DB'si yedeklenir
                  # (lol_balance.db = ana grup, group_<ad>.db = ek gruplar).
                  for db in /data/*.db; do
                    [ -f "$db" ] || continue
                    name=$(basename "$db" .db)
                    sqlite3 "$db" ".backup /data/backup/${name}-$(date +%F).db"
                  done
                  find /data/backup -name '*.db' -mtime +7 -delete
                  ls -lh /data/backup
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: lol-balance-data
