# CI deploy kimliği — GitHub Actions'ın "rollout restart" için kullandığı dar yetkili SA.
# Yalnızca lol-balance namespace'inde, yalnızca deployment restart/izleme yetkisi.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: lol-balance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: lol-balance
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]   # rollout restart = patch, status = get/watch
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]            # rollout status yeni RS'i izler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: lol-balance
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: lol-balance
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
---
# Uzun ömürlü token (kubeconfig'e gömülüp GitHub secret'ına konur)
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: lol-balance
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
